    <script>
      // GitHub Pages SPA 路由恢复：
      // 404.html 把原始路径写入 sessionStorage 后跳转到根路径加载本文件。
      // 这里取出原始路径并用 history.replaceState 恢复，前端路由即可匹配到正确页面。
      // 必须在 main.tsx 之前同步执行，以保证 BrowserRouter 读到正确的 URL。
      (function () {
        try {
          var saved = sessionStorage.getItem('cocotoast:spa-redirect');
          if (saved && saved.charAt(0) === '/') {
            sessionStorage.removeItem('cocotoast:spa-redirect');
            window.history.replaceState(null, '', saved);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
